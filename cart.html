<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
    <title>Meu carrinho</title>
</head>

<body>
    <header></header>
    <main>
        <div>
            <h2>Meu carrinho</h2>
            <div class="cart-container">
                <table>
                    <tr>
                        <th class="cart-header" colspan="2">Produto</th>
                        <th class="cart-header">Quantidade</th>
                        <th class="cart-header" colspan="2">Total</th>
                    </tr>
                    <tr class="product-row">
                        <td ><img class="cart-product-img" src="assets/cachorro.webp" alt="Foto da ração de cachorro"></td>
                        <td class="cart-product-name">Ração Premier Pet Raças Específicas Shih Tzu Adulto</td>
                        <td>
                            <div class="quantity-button">
                                <button>−</button>
                                <span>1</span>
                                <button>+</button>
                            </div>
                        </td>
                        <td class="cart-price">R$ 100</td>
                        <td><span class="underlined-text warning-text">Deletar</span></td>
                    </tr>
                    <tr class="product-row">
                        <td><img class="cart-product-img" src="assets/gato.jpeg" alt="Foto da ração de gato"></td>
                        <td class="cart-product-name">Ração Seca Golden Salmão para Gatos Adultos Castrados</td>
                        <td>
                            <div class="quantity-button">
                                <button>−</button>
                                <span>1</span>
                                <button>+</button>
                            </div>
                        </td>
                        <td class="cart-price">R$ 190</td>
                        <td><span class="underlined-text warning-text">Deletar</span></td>
                    </tr>
                </table>
            </div>
        </div>
        <div>
            <h2>Resumo do Pedido</h2>
            <div class="cart-container">
                <p class="cart-summary-highlight">Subtotal(2 itens): R$ 290</p>
                <p class="cart-summary">Descontos: R$ 0</p>
                <p class="cart-summary">
                    Frete: <span class="underlined-text cart-summary">Calcular</span>
                </p>
                <p class="cart-summary-highlight">Total: R$ 290</p>
                <button class="checkout-button">Finalizar Compra</button>
            </div>
        </div>
    </main>
    <footer></footer>
</body>

</html>

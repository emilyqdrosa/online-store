<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart.css">
    <title>Document</title>
</head>
<body>
    <header></header>
    <main>
        <div>
            <h2 class="cart-title">Meu carrinho</h2>
            <div>
                <table>
                    <tr>
                        <th class="table-header">Produto</th>
                        <th class="table-header">Quantidade</th>
                        <th class="table-header">Total</th>
                    </tr>
                    <tr>
                        <td class="cart-img"><img src="assets/racao-cachorro.webp" alt="Foto da ração"></td>
                        <td class="cart-product-name">Ração Premier Pet Raças Específicas Shih Tzu Adulto</td>
                        <td></td>
                        <td class="cart-price">R$ 100</td>
                        <td></td>
                    </tr>
                    <tr>
                        <td class="cart-img"><img src="assets/racao-gato.jpg" alt="Foto da ração"></td>
                        <td class="cart-product-name">Ração Seca Golden Salmão para Gatos Adultos Castrados</td>
                        <td></td>
                        <td class="cart-price">R$ 190</td>
                        <td></td>
                    </tr>
                </table>
            </div>
        </div>
        <div>
            <h2 class="cart-title">Resumo do Pedido</h2>
            <div>
                <p class="cart-summary">Subtotal(2 itens): R$ 290</p>
                <p class="cart-summary">Descontos: R$ 0</p>
                <p class="cart-summary">Frete: <p class="underlined-text">Calcular</p></p>
                <p class="cart-summary">Total: R$ 200</p>
                <button class="checkout-button">Finalizar Compra</button>
            </div>
        </div>
    </main>
    <footer></footer>
</body>
</html>
